  <!-- Bottom band -->
  <rect x="0" y="57" width="80" height="5" fill="#8A1538"/>
  <!-- Gold line -->
  <rect x="0" y="64" width="80" height="1.5" fill="#C9A86A"/>
  <!-- Small squares row -->
  <rect x="6"  y="68" width="5" height="5" fill="#8A1538"/>
  <rect x="16" y="68" width="5" height="5" fill="#C9A86A"/>
  <rect x="26" y="68" width="5" height="5" fill="#8A1538"/>
  <rect x="36" y="68" width="5" height="5" fill="#C9A86A"/>
  <rect x="46" y="68" width="5" height="5" fill="#8A1538"/>
  <rect x="56" y="68" width="5" height="5" fill="#C9A86A"/>
  <rect x="66" y="68" width="5" height="5" fill="#8A1538"/>
</svg>
