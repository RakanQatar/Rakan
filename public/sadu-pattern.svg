  <!-- Gold accent line -->
  <rect x="0" y="7" width="80" height="1.5" fill="#C9A86A"/>
  <!-- Diamonds row 1 -->
  <polygon points="10,11 16,17 10,23 4,17" fill="#8A1538"/>
  <polygon points="30,11 36,17 30,23 24,17" fill="#8A1538"/>
  <polygon points="50,11 56,17 50,23 44,17" fill="#8A1538"/>
  <polygon points="70,11 76,17 70,23 64,17" fill="#8A1538"/>
  <!-- Gold line -->
  <rect x="0" y="25" width="80" height="1.5" fill="#C9A86A"/>
