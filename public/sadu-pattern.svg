  <rect x="0" y="28" width="80" height="5" fill="#8A1538"/>
  <!-- Gold line -->
  <rect x="0" y="35" width="80" height="1.5" fill="#C9A86A"/>
  <!-- Diamonds row 2 (offset) -->
  <polygon points="20,39 26,45 20,51 14,45" fill="#8A1538"/>
  <polygon points="40,39 46,45 40,51 34,45" fill="#8A1538"/>
  <polygon points="60,39 66,45 60,51 54,45" fill="#8A1538"/>
  <!-- Gold line -->
